[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mosscode"
version = "0.1.0"
description = "A terminal coding agent: tools, permissions, MCP, skills, hooks, sub-agents and agent teams."
readme = {file = "docs/pypi.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "yzd11"}]
requires-python = ">=3.12"
keywords = ["coding-agent", "ai", "llm", "terminal", "cli", "mcp", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = ["anthropic>=1.12,<2", "openai>=3.26,<4", "textual>=8.2,<9", "PyYAML>=6.0,<7", "pydantic>=2.13,<3", "mcp>=1.30,<1.31", "jsonschema>=4.23,<5", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "markdownify>=0.14,<2", "Pillow>=12,<14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx2>=2,<3", "ruff==0.17.3"]

[project.urls]
Homepage = "https://github.com/yzd11/mosscode"
Source = "https://github.com/yzd11/mosscode"
Issues = "https://github.com/yzd11/mosscode/issues"
Changelog = "https://github.com/yzd11/mosscode/blob/main/CHANGELOG.md"

[project.scripts]
moss = "mosscode.launcher:main"
mosscode = "mosscode.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mosscode.skills" = ["builtin/*/SKILL.md", "builtin/*/tool.json", "builtin/*/scripts/*.py"]
"mosscode.agents" = ["builtin/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
faulthandler_timeout = 300  # A test that hangs prints every thread's stack instead of stalling silently.

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # Code examples in the docs keep their compact layout.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "B905",  # zip() without strict=: the lengths are equal by construction where it is used.
    "E731",  # A one-line lambda bound to a local name reads better than a nested def.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",  # Some test modules import helpers after the fixtures they depend on.
    "B008",  # Fake providers default to an immutable Usage().
]
