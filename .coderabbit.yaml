# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
# MossCode: README / docs 为中文，代码与注释为英文；开源项目，审查意见用英文输出
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/requirements-lock.txt"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.test-artifacts/**"
    - "!**/*.egg-info/**"
    - "!**/__pycache__/**"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_instructions:
    - path: "src/mosscode/**"
      instructions: |
        重点审查：
        1. Python 3.12+，跨平台（Windows / Linux / macOS）：路径一律用 pathlib，不假设分隔符；Windows 专属代码必须在其他系统上安全跳过；
        2. 代码、注释和 docstring 用英文，行宽 120，须通过 ruff check 与 ruff format --check；
        3. 新增依赖须说明理由并确认与 MIT 兼容，不引入 GPL。
    - path: "src/mosscode/permissions.py"
      instructions: |
        安全边界，严格审查：权限检查、命令风险分级与路径检查绝不能被绕过或放宽；未知状态绝不静默当成允许，失败必须 fail-closed；改动须配绕过方向的测试。
    - path: "src/mosscode/credentials.py"
      instructions: |
        安全边界，严格审查：禁止读取、打印、提交或经命令行参数（argv）、日志、报错详情输出任何凭据；config.yaml、.env、~/.mosscode/ 下的配置都可能含 API 密钥；禁止默认降级到明文存储敏感凭据。
    - path: "src/mosscode/security.py"
      instructions: |
        安全边界，严格审查：外部 URL、文件路径与命令参数必须做白名单或规范化校验；不要用裸 except: pass 或无条件 .ok() 吞掉取消（Cancel）与 I/O 错误。
    - path: "src/mosscode/tools/**"
      instructions: |
        重点审查：工具注册、校验、授权与执行；子进程、文件句柄或网络连接在异常退出时是否存在泄漏或孤儿进程；shell 工具在 Windows 上优先用 Git Bash，找不到时用 PowerShell，两条路径都要覆盖。
    - path: "src/mosscode/sandbox/**"
      instructions: |
        重点审查：沙箱隔离是否完整，跨平台后端（bwrap / seatbelt / Windows token）行为是否一致，失败时是否 fail-closed 而非静默放行。
    - path: "src/mosscode/teams/**"
      instructions: |
        重点审查：并发读写、文件锁、黑板共享状态与状态更新是否存在竞态（TOCTOU）与未回滚状态；跨进程共享状态文件必须用原子写（临时文件 + rename）与文件锁保护；写操作需幂等或加锁。
    - path: "src/mosscode/acp/**"
      instructions: |
        重点审查：ACP 编辑器服务（PyCharm / IntelliJ / Zed）的权限、鉴权与会话管理；外部接口 / JSON 返回 null、缺字段或超时 / 取消（Cancelled）信号是否被正确透传而非静默吞错。
    - path: "src/mosscode/mcp*.py"
      instructions: |
        重点审查：MCP 客户端 / 服务端配置、信任边界与外部工具调用；不可信的 MCP 服务端返回内容不得直接当作指令执行，不得把凭据透传给不可信服务端。
    - path: "src/mosscode/providers.py"
      instructions: |
        重点审查：三种模型协议适配是否正确透传超时、取消与错误；不要把 API 密钥、请求体或模型返回的敏感内容写入日志。
    - path: "tests/**"
      instructions: |
        检查新增测试是否覆盖失败路径与边界条件；测试用模拟模型、模拟 SSE 与无界面 TUI，不读取 API 配置、不发送网络请求；临时目录用 --basetemp .test-artifacts/<名称>，避免硬编码临时路径（需兼容软链接与跨平台路径）；不要为让测试通过而放宽断言或跳过测试。
    - path: "scripts/**"
      instructions: |
        重点审查：评估与发版脚本是否会请求真实服务并产生费用，须在注释或输出中明确说明；不要在脚本中硬编码凭据或真实 API 配置。
    - path: ".github/workflows/**"
      instructions: |
        重点审查：CI / 发版工作流的权限是否最小（contents: read，checkout 时 persist-credentials: false）；新增步骤不得泄露凭据或把不可信的 PR 内容当作脚本执行。
    - path: "docs/reference/**"
      instructions: |
        用户可见行为变化时，须同步更新对应文档；README 只有安装、配置、使用、架构四个二级标题；文档中的相对链接必须能解析。
  tools:
    ast-grep:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    clippy:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    golangci-lint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/usage.md"
      - "docs/claude-code-patterns.md"
