name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # The release runs it on the tagged commit before uploading anything.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # No FORCE_COLOR: it turns the tests' plain Rich consoles into 16-colour terminals, and Rich caches a
  # style's escape codes on the shared style object, so later truecolour renders would reuse them.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
      - run: uvx ruff@0.17.3 check --output-format=github .
      - run: uvx ruff@0.17.3 format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The hosted ARM pool can time out before starting any test; keep full macOS coverage on Intel.
        os: [windows-latest, ubuntu-latest, macos-26-intel]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          activate-environment: true
      - name: Install ripgrep
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version
      - run: uv pip install -e ".[dev]"
      - name: Prepare test artifacts
        run: python -c "from pathlib import Path; Path('.test-artifacts').mkdir(exist_ok=True)"
      - run: python -m pytest -q --color=yes --basetemp .test-artifacts/ci -p no:cacheprovider
      - run: moss --version

  test-without-ripgrep:
    name: test (ubuntu-latest, py3.12, no ripgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true
      - name: Make sure ripgrep is absent
        run: |
          while command -v rg >/dev/null; do sudo rm "$(command -v rg)"; done
      - run: uv pip install -e ".[dev]"
      - name: Prepare test artifacts
        run: python -c "from pathlib import Path; Path('.test-artifacts').mkdir(exist_ok=True)"
      - run: python -m pytest -q --color=yes --basetemp .test-artifacts/ci -p no:cacheprovider

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/moss --version
          /tmp/wheel-check/bin/moss --help > /dev/null
          cd "$(mktemp -d)"
          /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
