name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
      - run: uvx ruff@0.17.3 check --output-format=github .
      - run: uvx ruff@0.17.3 format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          activate-environment: true
      - name: Install ripgrep
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version
      - run: uv pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: moss --version

  test-without-ripgrep:
    name: test (ubuntu-latest, py3.12, no ripgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true
      - name: Make sure ripgrep is absent
        run: |
          while command -v rg >/dev/null; do sudo rm "$(command -v rg)"; done
      - run: uv pip install -e ".[dev]"
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/moss --version
          /tmp/wheel-check/bin/moss --help > /dev/null
