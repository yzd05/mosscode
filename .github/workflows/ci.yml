name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # The release runs it on the tagged commit before uploading anything.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # No FORCE_COLOR: it turns the tests' plain Rich consoles into 16-colour terminals, and Rich caches a
  # style's escape codes on the shared style object, so later truecolour renders would reuse them.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
      - run: uvx ruff@0.17.3 check --output-format=github .
      - run: uvx ruff@0.17.3 format --check .
      - name: Enforce shrink-only layer allowlist
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import ast
          import os
          import subprocess
          import sys
          from pathlib import Path

          def extract(source: str) -> frozenset[tuple[str, str]]:
              tree = ast.parse(source)
              for node in tree.body:
                  target = None
                  value = None
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      target, value = node.target.id, node.value
                  elif isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                      target, value = node.targets[0].id, node.value
                  if target == "ALLOWLIST" and value is not None:
                      inner = value.args[0] if isinstance(value, ast.Call) and len(value.args) == 1 else value
                      return frozenset((str(s), str(d)) for s, d in ast.literal_eval(inner))
              raise SystemExit("ALLOWLIST definition not found in tests/test_layers.py")

          base_sha = os.environ["BASE_SHA"]
          probe = subprocess.run(["git", "cat-file", "-e", f"{base_sha}:tests/test_layers.py"])
          if probe.returncode != 0:
              print("No baseline tests/test_layers.py on base commit; skipping shrink-only diff.")
              raise SystemExit(0)
          base_src = subprocess.check_output(["git", "show", f"{base_sha}:tests/test_layers.py"], text=True, encoding="utf-8")
          head_src = Path("tests/test_layers.py").read_text(encoding="utf-8")
          added = sorted(extract(head_src) - extract(base_src))
          if added:
              print(f"Layer ALLOWLIST is shrink-only; new or swapped entries are forbidden: {added}", file=sys.stderr)
              raise SystemExit(1)
          print("Layer ALLOWLIST shrink-only check passed.")
          PY

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ github.event_name == 'push' }}
      matrix:
        # Routine pushes run Linux + Windows on 3.12 to avoid macOS/matrix runner bursts;
        # PRs, releases (workflow_call) and manual dispatches run the full 3-OS x 2-Python matrix.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["windows-latest", "ubuntu-latest", "macos-26-intel"]') }}
        python: ${{ github.event_name == 'push' && fromJSON('["3.12"]') || fromJSON('["3.12", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          activate-environment: true
      - name: Install ripgrep
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version
      - run: uv pip install -e ".[dev]"
      - name: Prepare test artifacts
        run: python -c "from pathlib import Path; Path('.test-artifacts').mkdir(exist_ok=True)"
      - run: python -m pytest -q --color=yes --basetemp .test-artifacts/ci -p no:cacheprovider
      - run: moss --version

  test-without-ripgrep:
    if: github.event_name != 'push'
    name: test (ubuntu-latest, py3.12, no ripgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true
      - name: Make sure ripgrep is absent
        run: |
          while command -v rg >/dev/null; do sudo rm "$(command -v rg)"; done
      - run: uv pip install -e ".[dev]"
      - name: Prepare test artifacts
        run: python -c "from pathlib import Path; Path('.test-artifacts').mkdir(exist_ok=True)"
      - run: python -m pytest -q --color=yes --basetemp .test-artifacts/ci -p no:cacheprovider

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # Publishes no major-version tag.
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/moss --version
          /tmp/wheel-check/bin/moss --help > /dev/null
          cd "$(mktemp -d)"
          /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
