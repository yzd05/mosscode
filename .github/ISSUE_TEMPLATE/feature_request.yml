name: 功能建议
description: 新功能或对现有行为的改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在做什么时遇到了不便，现在怎么绕过
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 希望 MossCode 怎样表现：命令、配置或界面上的变化
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: 其他工具的做法
      description: Claude Code、pi、Codex CLI 等是否有类似功能，行为如何
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 例如用 Skill、Hook、MCP Server 或子 Agent 定义能否实现
